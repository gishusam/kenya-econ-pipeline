version: 2

models:
  - name: stg_economic_observations
    description: Canonical cross-source economic observations. All source revisions are retained.
    columns:
      - name: source_record_hash
        tests: [not_null, unique]
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: ['KNBS', 'CBK', 'WORLD_BANK']
      - name: indicator_code
        tests: [not_null]
      - name: geography
        tests: [not_null]
      - name: frequency
        tests:
          - not_null
          - accepted_values:
              values: ['daily', 'monthly', 'quarterly', 'annual']
      - name: value
        tests: [not_null]
      - name: revision_rank
        tests: [not_null]
      - name: is_latest_revision
        tests: [not_null]
