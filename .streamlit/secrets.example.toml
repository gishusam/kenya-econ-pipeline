# Streamlit Community Cloud configuration.
# Prefer a dedicated read-only service account for the dashboard.
GCP_PROJECT_ID = "your-gcp-project-id"
BQ_LOCATION = "africa-south1"

# Paste a READ-ONLY service-account JSON object here only if Streamlit
# Community Cloud cannot use another workload identity mechanism.
[gcp_service_account]
type = "service_account"
project_id = "your-gcp-project-id"
private_key_id = "replace-me"
private_key = "replace-with-read-only-service-account-private-key"
client_email = "kenya-econ-dashboard@your-gcp-project-id.iam.gserviceaccount.com"
client_id = "replace-me"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "replace-me"
